[Server]
  Debug = false
  # rtmp 推流秘钥
  RTMPSecret = '123'
  # 登录用户名
  Username = 'admin'
  # 登录密码
  Password = 'admin'

  # ai 分析服务
  [Server.AI]
    # 是否禁用 ai 分析服务
    Disabled = false
    # 保留天数
    RetainDays = 0
    # 全局默认分析间隔（秒）
    # 0   = 使用内置默认值（5 秒）
    # 1   = 每秒 1 张
    # 0.5 = 每秒 2 张
    # 5   = 每 5 秒 1 张（推荐，CPU 占用低）
    # 30  = 每 30 秒 1 张（超低频场景）
    AnalysisInterval = 5
    # 告警冷却时间（秒）：同一目标在此时间窗口内不重复触发告警
    # 判定规则：标签相同 + 检测框与上次告警框 IoU > 0.3，视为同一目标
    # 0  = 使用内置默认值（30 秒）
    # 10 = 10 秒内不重复告警（适合快速移动场景）
    # 30 = 30 秒内不重复告警（推荐）
    # 60 = 1 分钟内不重复告警（适合目标长时间驻留场景）
    AlertCooldownSeconds = 10

  # 对外提供的服务，建议由 nginx 代理
  [Server.HTTP]
    # http 端口
    Port = 15123
    # 请求超时时间
    Timeout = '1m0s'
    # jwt 秘钥，空串时，每次启动程序将随机赋值
    JwtSecret = '6caOiETMs8SPWNHgEKA1Jhmn9wxpjAj9'
    # 第三方认证服务地址，空串则不启用，post 请求返回 200 表示认证通过，填写本服务 /health 表示免鉴权但不安全!
    AuthURL = ''

    [Server.HTTP.PProf]
      # 是否启用 pprof, 建议设置为 true
      Enabled = true
      # 访问白名单
      AccessIps = ['::1', '127.0.0.1']

  # 录像配置
  [Server.Recording]
    # 是否禁用录制（全局开关，true=禁用）
    Disabled = false
    # 通道未设置时的默认录像模式：always/ai/none
    DefaultMode = 'always'
    # 录像存储根目录（相对于工作目录）
    StorageDir = './configs/recordings'
    # 录像保留天数（超过则清理）
    RetainDays = 3
    # 磁盘使用率阈值（百分比），超过则触发循环覆盖
    DiskUsageThreshold = 95.0
    # MP4 切片时长（秒）
    SegmentSeconds = 10

  [Server.Webhook]
    # 推送目标 URL 数组，secret 内嵌于 URL query 参数（如 http://host/webhook/events?secret=xxx）
    # 发送时 secret 会从 URL 中提取并放入 Authorization header，URL 本身不携带 secret
    Targets = []
    # 最大重试次数，0 = 内置默认 3 次
    MaxRetry = 3
    # 每个目标的 channel 缓冲队列大小，0 = 内置默认 64，满队列时新事件被丢弃并记录警告
    BufferSize = 64
    # 本节点接收 webhook 事件时校验的密钥，首次启动自动生成并持久化，勿置空
    RecvSecret = ''

[Data]
  # 数据库支持 sqlite/postgres/mysql, 使用 sqlite 时 dsn 应当填写文件存储路径
  [Data.Database]
    Dsn = './configs/data.db'
    MaxIdleConns = 10
    MaxOpenConns = 50
    ConnMaxLifetime = '6h0m0s'
    SlowThreshold = '200ms'

[Log]
  # 日志存储目录，不能使用特殊符号
  Dir = './logs'
  # 记录级别 debug/info/warn/error
  Level = 'debug'
  # 保留日志多久，超过时间自动删除
  MaxAge = '744h0m0s'
  # 多久时间，分割一个新的日志文件
  RotationTime = '12h0m0s'
  # 多大文件，分割一个新的日志文件(MB)
  RotationSize = 50

[Sip]
  # 对设备宣告的本机地址(可选), 为空时按连接来源自动探测, 探测不可达时回退到 Media.SDPIP
  Host = '192.168.1.241'
  # 服务监听的 TCP/UDP 端口号
  Port = 15060
  # GB/T 28181 20 位国标 ID
  ID = '34010000002000000001'
  # 全局注册密码，每个设备可单独设置，空串则无限制接入
  Password = ''
  # 是否启用 SIP-TLS 监听
  EnableTLS = false
  # SIP-TLS 监听端口，0 表示与 Port 相同
  TLSPort = 15061
  # SIP-TLS 证书文件路径（PEM）
  TLSCert = ''
  # SIP-TLS 私钥文件路径（PEM）
  TLSKey = ''
  # 是否校验设备上报源IP与注册源IP一致
  StrictSourceCheck = false
  # 是否要求 MESSAGE/NOTIFY 携带 Digest 鉴权
  RequireMessageAuth = false
  # 是否启用 PTZ 弱确认模式；命令发送成功但设备未返回 DeviceControl 应答时按成功处理
  PTZWeakConfirm = false

  [Sip.DirectTCPDownload]
    # 是否启用 GB/T 28181-2014 附录 O 裸 TCP 文件下载；默认关闭
    Enabled = false
    # 启用后仍仅允许以下设备国标 ID
    DeviceAllowlist = []
    # 下载文件存储根目录
    StorageDir = './configs/downloads/gb28181'
    # 完成文件保留天数
    RetainDays = 7
    # INVITE SDP 中的接收端占位端口
    OfferPort = 9
    # 单文件最大字节数（10 GiB）
    MaxFileSize = 10737418240
    # 全局/单设备最大并发数
    GlobalConcurrency = 4
    DeviceConcurrency = 1
    # 连接、首字节、空闲和总超时
    DialTimeout = '5s'
    FirstByteTimeout = '15s'
    IdleTimeout = '30s'
    TotalTimeout = '2h0m0s'
    # 是否允许 SDP IP 与 REGISTER 地址不一致
    AllowAddressMismatch = false
    # 地址不一致时必须同时匹配以下 CIDR；空列表保持拒绝
    AllowedAddressCIDRs = []

  [Sip.Log]
    # 是否启用 SIP 报文日志落盘
    Enabled = false
    # SIP 日志目录
    Dir = './logs/sip'
    # SIP 日志保留时长
    MaxAge = '72h0m0s'
    # SIP 日志分割时间
    RotationTime = '8h0m0s'
    # SIP 日志分割大小(MB)
    RotationSize = 50

[Media]
  # 媒体服务器 IP
  IP = '127.0.0.1'
  # 媒体服务器 HTTP 端口
  HTTPPort = 8080
  # 媒体服务器密钥
  Secret = 'jvRqCAzEg7AszBi4gm1cfhwXpmnVmJMG'
  # 媒体服务器类型 zlm/lalmax
  Type = 'zlm'
  # GB28181 抓拍图片回传基础地址，优先于 WebHookIP
  GBSnapshotBaseURL = ''
  # GB28181 FFmpeg 抓拍最大并发数，0 表示使用默认值 2
  GBSnapshotFFmpegConcurrency = 2
  # 用于流媒体 webhook 回调
  WebHookIP = '192.168.1.241'
  # 媒体服务器 RTP 端口范围
  RTPPortRange = '20000-20100'
  # 媒体服务器 SDP IP
  SDPIP = '192.168.1.241'
