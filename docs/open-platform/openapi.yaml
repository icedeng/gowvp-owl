    "schemas": {
      "AccessPolicy": {
        "additionalProperties": false,
        "properties": {
          "allow_any_ip": {
            "type": "boolean",
            "description": "true 显式允许任意来源；false 时只允许 cidrs，空列表拒绝全部来源。",
            "example": false
          },
          "burst": {
            "maximum": 2000,
            "minimum": 1,
            "type": "integer",
            "description": "应用业务请求突发容量。",
            "example": 40
          },
          "channel_limit": {
            "maximum": 100,
            "minimum": 1,
            "type": "integer",
            "description": "应用对同一通道可同时保留的会话上限。",
            "example": 2
          },
          "cidrs": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "description": "允许的 CIDR 地址范围。应用中表示请求来源，回调目标中表示可连接目标地址范围。",
            "example": [
              "10.144.0.0/15"
            ]
          },
          "delivery_limit": {
            "maximum": 20,
            "minimum": 1,
            "type": "integer",
            "description": "应用并发投递和投递频率额度。",
            "example": 2
          },
          "download_limit": {
            "maximum": 20,
            "minimum": 1,
            "type": "integer",
            "description": "录像读取并发上限（播放/下载入口）。",
            "example": 2
          },
          "live_limit": {
            "maximum": 100,
            "minimum": 1,
            "type": "integer",
            "description": "应用可同时保留的实时会话上限。",
            "example": 5
          },
          "qps": {
            "maximum": 1000,
            "minimum": 1,
            "type": "integer",
            "description": "应用每秒业务请求额度，首期为单实例限流。",
            "example": 20
          },
          "revision": {
            "minimum": 1,
            "type": "integer",
            "description": "乐观锁版本。修改时传入最近查询的 revision，冲突返回 409；成功后递增。",
            "example": 1
          },
          "snapshot_limit": {
            "maximum": 20,
            "minimum": 1,
            "type": "integer",
            "description": "应用排队或执行中的抓拍任务上限。",
            "example": 2
          },
          "subscription_limit": {
            "maximum": 100,
            "minimum": 1,
            "type": "integer",
            "description": "应用未取消的订阅数量上限。",
            "example": 10
          }
        },
        "required": [
          "revision"
        ],
        "type": "object"
      },
      "App": {
        "additionalProperties": false,
        "properties": {
          "allow_any_ip": {
            "type": "boolean",
            "description": "true 显式允许任意来源；false 时只允许 cidrs，空列表拒绝全部来源。",
            "example": false
          },
          "allowed_actions": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "description": "云台动作白名单，与通道实际能力取交集。扩展动作需显式授予。",
            "example": [
              "left",
              "right",
              "up",
              "down",
              "zoom_in",
              "zoom_out",
              "preset_call"
            ],
            "nullable": true
          },
          "burst": {
            "maximum": 2000,
            "minimum": 1,
            "type": "integer",
            "description": "应用业务请求突发容量。",
            "example": 40
          },
          "channel_limit": {
            "maximum": 100,
            "minimum": 1,
            "type": "integer",
            "description": "应用对同一通道可同时保留的会话上限。",
            "example": 2
          },
          "cidrs": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "description": "允许的 CIDR 地址范围。应用中表示请求来源，回调目标中表示可连接目标地址范围。",
            "example": [
              "10.144.0.0/15"
            ],
            "nullable": true
          },
          "contact": {
            "type": "string",
            "description": "负责人联系方式。",
            "example": "负责人联系方式"
          },
          "created_at": {
            "format": "date-time",
            "type": "string",
            "description": "记录创建时间，RFC3339。",
            "example": "2026-11-04T08:00:00Z"
          },
          "delivery_limit": {
            "maximum": 20,
            "minimum": 1,
            "type": "integer",
            "description": "应用并发投递和投递频率额度。",
            "example": 2
          },
          "device_access_mode": {
            "enum": [
              "all",
              "selected_devices"
            ],
            "type": "string",
            "description": "all 包含所有现有及未来设备；selected_devices 只包含 device_ids 中的内部设备。",
            "example": "selected_devices"
          },
          "device_ids": {
            "items": {
              "type": "string"
            },
            "maxItems": 10000,
            "type": "array",
            "description": "内部设备 ID 数组。指定模式至少一项；自动继承这些设备的新通道，不继承新设备。",
            "example": [
              "device-001"
            ],
            "nullable": true
          },
          "download_limit": {
            "maximum": 20,
            "minimum": 1,
            "type": "integer",
            "description": "录像读取并发上限（播放/下载入口）。",
            "example": 2
          },
          "expires_at": {
            "format": "date-time",
            "nullable": true,
            "type": "string",
            "description": "RFC3339 到期时间，null 表示未设置应用或凭据到期；媒体会话和票据有独立有效期。",
            "example": "2026-11-04T08:05:00Z"
          },
          "id": {
            "type": "string",
            "description": "当前资源内部唯一标识。设备/通道的内部 ID 与国标编码不同。",
            "example": "app-001"
          },
          "live_limit": {
            "maximum": 100,
            "minimum": 1,
            "type": "integer",
            "description": "应用可同时保留的实时会话上限。",
            "example": 5
          },
          "name": {
            "maxLength": 120,
            "type": "string",
            "description": "资源显示名称。",
            "example": "示例应用"
          },
          "organization": {
            "type": "string",
            "description": "接入单位名称。",
            "example": "示例接入单位"
          },
          "owner": {
            "type": "string",
            "description": "应用负责人。",
            "example": "接口负责人"
          },
          "purpose": {
            "maxLength": 2000,
            "type": "string",
            "description": "应用用途说明。",
            "example": "视频与告警集成"
          },
          "qps": {
            "maximum": 1000,
            "minimum": 1,
            "type": "integer",
            "description": "应用每秒业务请求额度，首期为单实例限流。",
            "example": 20
          },
          "revision": {
            "minimum": 1,
            "type": "integer",
            "description": "乐观锁版本。修改时传入最近查询的 revision，冲突返回 409；成功后递增。",
            "example": 1
          },
          "scopes": {
            "items": {
              "enum": [
                "device:read",
                "channel:read",
                "live:play",
                "recording:read",
                "recording:play",
                "recording:download",
                "event:read",
                "event:image",
                "snapshot:capture",
                "ptz:control",
                "event:subscribe"
              ],
              "type": "string"
            },
            "type": "array",
            "description": "应用可调用的接口权限，仍需同时满足设备范围和来源 IP 策略。",
            "example": [
              "device:read",
              "channel:read",
              "live:play"
            ],
            "nullable": true
          },
          "snapshot_limit": {
            "maximum": 20,
            "minimum": 1,
            "type": "integer",
            "description": "应用排队或执行中的抓拍任务上限。",
            "example": 2
          },
          "status": {
            "enum": [
              "disabled",
              "enabled",
              "archived"
            ],
            "type": "string",
            "description": "资源当前生命周期状态，详见枚举及该接口说明。",
            "example": "disabled"
          },
          "subscription_limit": {
            "maximum": 100,
            "minimum": 1,
            "type": "integer",
            "description": "应用未取消的订阅数量上限。",
            "example": 10
          },
          "updated_at": {
            "format": "date-time",
            "type": "string",
            "description": "最后修改时间，RFC3339。",
            "example": "2026-11-04T08:00:00Z"
          }
        },
        "type": "object"
      },
