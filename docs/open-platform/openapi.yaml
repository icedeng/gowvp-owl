  "info": {
    "description": "Owl 三方应用开放接口。完整在线文档位于 /web/#/open-platform/docs，公开可读，无需管理员账号。业务API仅AK/SK，管理API仅管理员JWT，媒体仅短期票据。 支持按设备完整编码和完整通道编码查询、播放、抓拍及云台控制；内部 ID 接口保持兼容。",
    "title": "Owl Third-party Open Platform",
    "version": "1.0.0"
  },
  "openapi": "3.0.3",
  "paths": {
    "/openapi/v1/devices/by-code/{device_code}": {
      "get": {
        "description": "直接使用设备完整编码定位授权资源，无需先换取内部 ID。设备不存在或未授权均返回 404；同一设备下重复通道编码返回 409 AMBIGUOUS_RESOURCE_CODE。返回当前应用设备授权范围内的设备。资源不存在和越权统一返回 404。",
        "operationId": "get_openapi_v1_devices_by_code_device_code",
        "parameters": [
          {
            "name": "device_code",
            "in": "path",
            "required": true,
            "description": "设备完整编码，对应设备对象 device_id，按原字符串精确匹配；不是内部 id。",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            }
          },
          {
            "$ref": "#/components/parameters/XOwlAudience"
          },
          {
            "$ref": "#/components/parameters/XOwlTimestamp"
          },
          {
            "$ref": "#/components/parameters/XOwlNonce"
          },
          {
            "$ref": "#/components/parameters/XOwlContentSHA256"
          },
          {
            "in": "header",
            "name": "Authorization",
            "required": true,
            "description": "应用：OWL-HMAC-SHA256 Credential=<AK>,Signature=<小写hex>；管理员：Bearer <JWT>；媒体：Owl-Media <ticket>。",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/EnvelopeBase"
                    },
                    {
                      "properties": {
                        "data": {
                          "$ref": "#/components/schemas/Device"
                        }
                      },
                      "required": [
                        "data"
                      ],
                      "type": "object"
                    }
                  ]
                },
                "example": {
                  "code": "OK",
                  "message": "success",
                  "request_id": "request-001",
                  "data": {
                    "device_id": "50010700001320000001",
                    "id": "device-001",
                    "is_online": true,
                    "name": "示例摄像机",
                    "type": "GB28181"
                  }
                }
              }
            },
            "description": "成功；检查 data 中的实际状态。secret_key 仅生成/轮换响应返回一次。"
          },
          "400": {
            "$ref": "#/components/responses/HTTP400"
          },
          "401": {
            "$ref": "#/components/responses/HTTP401"
          },
          "403": {
            "$ref": "#/components/responses/HTTP403"
          },
          "404": {
            "$ref": "#/components/responses/HTTP404"
          },
          "409": {
            "$ref": "#/components/responses/HTTP409"
          },
          "413": {
            "$ref": "#/components/responses/HTTP413"
          },
          "429": {
            "$ref": "#/components/responses/HTTP429"
          },
          "503": {
            "$ref": "#/components/responses/HTTP503"
          }
        },
        "security": [
          {
            "ApplicationSignature": []
          }
        ],
        "summary": "按设备编码查询设备",
        "tags": [
          "业务"
        ],
        "x-scope": "device:read"
      }
    },
