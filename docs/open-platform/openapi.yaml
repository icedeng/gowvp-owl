{
  "components": {
    "parameters": {
      "IdempotencyKey": {
        "in": "header",
        "name": "Idempotency-Key",
        "required": true,
        "schema": {
          "maxLength": 128,
          "type": "string"
        },
        "description": "写操作幂等键，最多 128 字符。同一应用/操作/键只对应一组参数；重试沿用幂等键但更新 nonce/签名。"
      },
      "Range": {
        "description": "可选单段字节范围，如 bytes=0-1023；不支持多段。",
        "in": "header",
        "name": "Range",
        "required": false,
        "schema": {
          "type": "string"
        }
      },
      "XOwlAudience": {
        "in": "header",
        "name": "X-Owl-Audience",
        "required": true,
        "schema": {
          "type": "string"
        },
        "description": "本页显示的固定 Audience，必须与服务端配置完全一致。"
      },
      "XOwlContentSHA256": {
        "in": "header",
        "name": "X-Owl-Content-SHA256",
        "required": true,
        "schema": {
          "type": "string"
        },
        "description": "实际发送 body 的 SHA256 小写十六进制，空 body 也必须计算。"
      },
      "XOwlNonce": {
        "in": "header",
        "name": "X-Owl-Nonce",
        "required": true,
        "schema": {
          "type": "string"
        },
        "description": "至少 16 个随机字节经 Base64URL 无填充编码；每次请求更换。"
      },
      "XOwlTimestamp": {
        "in": "header",
        "name": "X-Owl-Timestamp",
        "required": true,
        "schema": {
          "type": "string"
        },
        "description": "UTC Unix 秒数的十进制文本，时间误差须在 ±300 秒内。"
      }
    },
    "responses": {
      "HTTP400": {
        "content": {
          "application/json": {
            "schema": {
              "additionalProperties": false,
              "properties": {
                "code": {
                  "type": "string"
                },
                "data": {
                  "nullable": true
                },
                "message": {
                  "type": "string"
                },
                "request_id": {
                  "type": "string"
                }
              },
              "required": [
                "code",
                "message",
                "request_id",
                "data"
              ],
              "type": "object"
            }
          }
        },
        "description": "格式或参数错误"
      },
      "HTTP401": {
        "content": {
          "application/json": {
            "schema": {
              "additionalProperties": false,
              "properties": {
                "code": {
                  "type": "string"
                },
                "data": {
