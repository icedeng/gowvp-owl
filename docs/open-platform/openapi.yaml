                }
              },
              "required": [
                "code",
                "message",
                "request_id",
                "data"
              ],
              "type": "object"
            }
          }
        },
        "description": "认证失败或重放"
      },
      "HTTP403": {
        "content": {
          "application/json": {
            "schema": {
              "additionalProperties": false,
