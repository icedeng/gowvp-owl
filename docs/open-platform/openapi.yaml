    "/openapi/v1/devices/by-code/{device_code}/channels/{channel_code}/ptz": {
      "post": {
        "description": "直接使用设备完整编码与完整通道编码定位授权资源，无需先换取内部 ID。设备不存在或未授权均返回 404；同一设备下重复通道编码返回 409 AMBIGUOUS_RESOURCE_CODE。先查询 capabilities。连续动作 1—3 秒并由服务端停止；独占通道租约。HTTP 200 或 confirmed 仅表示命令流程结果，不代表真实到位；停止失败保留租约，阻止后续控制。安全停止沿用 POST /openapi/v1/ptz-commands/{command}/stop，command 为本响应中的命令 id。",
        "operationId": "post_openapi_v1_devices_by_code_device_code_channels_channel_code_ptz",
        "parameters": [
          {
            "name": "device_code",
            "in": "path",
            "required": true,
            "description": "设备完整编码，对应设备对象 device_id，按原字符串精确匹配；不是内部 id。",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            }
          },
          {
            "name": "channel_code",
            "in": "path",
            "required": true,
            "description": "设备上报的完整通道编码，对应通道对象 channel_id；不是内部 id，也不是录像机数字序号。必须属于路径中的设备。",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            }
          },
          {
            "$ref": "#/components/parameters/XOwlAudience"
          },
          {
            "$ref": "#/components/parameters/XOwlTimestamp"
          },
          {
            "$ref": "#/components/parameters/XOwlNonce"
          },
          {
            "$ref": "#/components/parameters/XOwlContentSHA256"
          },
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          },
          {
            "in": "header",
            "name": "Authorization",
            "required": true,
            "description": "应用：OWL-HMAC-SHA256 Credential=<AK>,Signature=<小写hex>；管理员：Bearer <JWT>；媒体：Owl-Media <ticket>。",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "header",
