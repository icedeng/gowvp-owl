    "/openapi/v1/ptz-commands": {
      "get": {
        "description": "按编码查询本应用在当前授权通道上的云台命令记录。支持 device_code、channel_code 编码精确筛选，也保留内部 device_id、channel_id；所有条件取交集，不会因未知编码退化为全量结果。仅传 channel_code 时匹配所有授权设备的同码通道。 默认按创建时间筛选最近 24 小时，可传 start/end，最大 7 天；size/cursor 分页。只返回记录，不触发设备动作。其他应用记录始终不可见；过期记录可在时间范围内返回，后续操作仍检查生命周期与当前权限。",
        "operationId": "get_openapi_v1_ptz_commands",
        "parameters": [
          {
            "in": "query",
            "name": "size",
            "required": false,
            "schema": {
              "default": 50,
              "maximum": 100,
              "minimum": 1,
              "type": "integer"
            },
            "description": "每页 1—100 条，默认 50。"
          },
          {
            "in": "query",
            "name": "cursor",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "上一页返回的 next_cursor；首次不传。翻页时保留相同筛选条件。"
          },
          {
            "$ref": "#/components/parameters/XOwlAudience"
          },
          {
            "$ref": "#/components/parameters/XOwlTimestamp"
          },
          {
            "$ref": "#/components/parameters/XOwlNonce"
          },
          {
            "$ref": "#/components/parameters/XOwlContentSHA256"
