            "application/json":
              "schema":
                "$ref": "#/components/schemas/PageGatewayView"
      "parameters":
        -
          "in": "query"
          "name": "page"
          "schema":
            "type": "integer"
            "minimum": 1
            "default": 1
        -
          "in": "query"
          "name": "size"
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
        -
          "in": "query"
          "name": "q"
          "schema":
            "type": "string"
        -
          "in": "query"
          "name": "group"
          "schema":
            "type": "string"
        -
          "in": "query"
          "name": "admin_state"
          "schema":
            "type": "string"
        -
          "in": "query"
          "name": "connection_state"
          "schema":
            "type": "string"
        -
          "in": "query"
          "name": "health_state"
          "schema":
            "type": "string"
        -
          "in": "query"
          "name": "sort"
          "schema":
            "type": "string"
        -
          "in": "query"
          "name": "order"
          "schema":
            "type": "string"
    "post":
      "operationId": "新增网关"
      "summary": "新增网关"
      "tags":
        - "接入网关"
      "responses":
        "default":
          "$ref": "#/components/responses/Failure"
        "200":
          "description": "已完成，或同幂等键重放原结果。"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GatewayView"
        "202":
          "description": "操作已接受；查询 operation_id 获取真实进度，禁止据此宣称已完成。"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Operation"
      "parameters":
        -
          "$ref": "#/components/parameters/IdempotencyKey"
        -
          "$ref": "#/components/parameters/IfMatchOptional"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreateRequest"
