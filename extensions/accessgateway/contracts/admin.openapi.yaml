            "application/json":
              "schema":
                "$ref": "#/components/schemas/Certificate"
      "parameters":
        -
          "in": "path"
          "name": "id"
          "required": true
          "schema":
            "type": "string"
          "description": "网关使用稳定 ID；会话、操作和计划使用对应内部 UUID。"
        -
          "$ref": "#/components/parameters/IdempotencyKey"
        -
          "$ref": "#/components/parameters/IfMatchOptional"
      "requestBody":
        "required": true
        "content":
          "multipart/form-data":
            "schema":
              "type": "object"
              "additionalProperties": false
              "properties":
                "ca_pem":
                  "type": "string"
                  "format": "binary"
                  "description": "单文件最多512 KiB；总请求最多2 MiB。私钥仅上传，不提供下载。"
                "client_cert_pem":
                  "type": "string"
                  "format": "binary"
                  "description": "单文件最多512 KiB；总请求最多2 MiB。私钥仅上传，不提供下载。"
                "client_key_pem":
                  "type": "string"
                  "format": "binary"
