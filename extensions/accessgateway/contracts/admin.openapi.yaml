"components":
  "securitySchemes":
    "adminBearer":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "JWT"
  "parameters":
    "IdempotencyKey":
      "in": "header"
      "name": "Idempotency-Key"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
      "description": "同一操作者/路由/对象下重复键重放原结果；同键异参409。"
    "IfMatchRequired":
      "in": "header"
      "name": "If-Match"
      "required": true
      "schema":
        "type": "string"
        "pattern": "^\"(0|[1-9][0-9]*)\"$"
      "description": "使用资源 revision 的强 ETag，如 \"3\"；缺失400，过期409。"
    "IfMatchOptional":
      "in": "header"
      "name": "If-Match"
      "required": false
      "schema":
        "type": "string"
        "pattern": "^\"(0|[1-9][0-9]*)\"$"
  "responses":
    "Failure":
      "description": "400 输入错误；401 非管理员；404 不存在；409 revision/绑定/状态/幂等冲突；413 大小限制；429 额度；503 模块未启用/网关或依赖不可用。错误包含定位 trace_id；不回显凭据。"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/HTTPError"
