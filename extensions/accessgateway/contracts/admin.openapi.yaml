"openapi": "3.0.3"
"info":
  "title": "Owl 公网接入网关管理 API"
  "version": "1.0.0"
  "description": "对应 platform/httpapi、core 和 service 的管理契约。所有调用必须使用现有平台管理员 Bearer JWT；不接受播放票据、query token 或私钥读取。JSON 严格拒绝未知/重复/缺失字段，标为可选的字段除外。十进制版本和字节计数使用非负 int64 字符串；null 表示未知，不能转为0。全部查询只访问 A 的存储/运行快照，浏览器不访问 B。"
"servers":
  -
    "url": "/"
    "description": "Owl 现有 API 前缀；以宿主路由配置为准。"
"security":
  -
    "adminBearer": []
"paths":
  "/access_gateways/{id}/release-reports":
    "post":
      "summary": "记录组件发布结果"
      "operationId": "release-reports"
      "description": "需要管理员身份、幂等键和当前管理版本。仅记录统一发布工具的结果，不执行远程命令。"
      "tags":
        - "接入网关"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
        -
          "name": "Idempotency-Key"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
        -
          "name": "If-Match"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ReleaseReport"
      "responses":
        "200":
          "description": "操作结果或幂等重放结果"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReleaseReport"
        "default":
          "$ref": "#/components/responses/Failure"
  "/access_gateways/{id}/channel-diagnostic":
    "post":
      "summary": "指定通道链路诊断"
      "operationId": "channel-diagnostic"
      "description": "需要管理员身份、幂等键和当前管理版本。使用独立临时点播，会话结束自动回收；最长约 50 秒。"
      "tags":
        - "接入网关"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
        -
          "name": "Idempotency-Key"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
        -
          "name": "If-Match"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ChannelDiagnosticRequest"
      "responses":
        "200":
          "description": "操作结果或幂等重放结果"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/DiagnosticResult"
        "default":
          "$ref": "#/components/responses/Failure"
  "/access_gateways":
    "get":
      "operationId": "查询网关批量快照"
      "summary": "查询网关批量快照"
      "tags":
        - "接入网关"
      "responses":
        "default":
          "$ref": "#/components/responses/Failure"
        "200":
          "description": "已完成，或同幂等键重放原结果。"
