services:
  gowvp:
    image: registry.cn-shanghai.aliyuncs.com/ixugo/gowvp:latest
    environment:
      OWL_MEDIA_SECRET: ${OWL_MEDIA_SECRET:?set OWL_MEDIA_SECRET for the shared Owl and ZLMediaKit API secret}
      OWL_MEDIA_IP: zlm
      OWL_MEDIA_HTTP_PORT: "80"
      OWL_MEDIA_WEBHOOK_IP: gowvp
      OWL_MEDIA_SDP_IP: ${OWL_MEDIA_SDP_IP:-}
    ports:
      - 15123:15123 # 管理平台 http 端口
      - 15060:15060 # gb28181 sip tcp 端口
      - 15060:15060/udp # gb28181 sip udp 端口
    volumes:
      # - ./logs:/app/logs # 如果需要持久化日志，请取消注释
      - ./configs:/app/configs
    networks:
      - gowvp-network
    depends_on:
      - zlm
  zlm:
    image: ${ZLM_IMAGE:-gowvp/zlmediakit:2fa539-tcp-rtcp}
    build:
      context: .
      dockerfile: Dockerfile_zlm
      target: zlm-runtime
      args:
        ZLM_COMMIT: 2fa539807370c4bcfca9801bde1dd2fdd95ba113
    restart: always
    environment:
      OWL_MEDIA_SECRET: ${OWL_MEDIA_SECRET:?set OWL_MEDIA_SECRET for the shared Owl and ZLMediaKit API secret}
    # 推荐 linux 主机使用 host 模式
    # network_mode: host
    networks:
      - gowvp-network
    ports:
      - 1935:1935 # rtmp
      - 554:554 # rtsp
      - 8080:80 # api
      - 8443:443
      - 10000:10000
      - 10000:10000/udp
      - 8000:8000/udp
      - 9000:9000/udp
      - 20000-20100:20000-20100
      - 20000-20100:20000-20100/udp
    volumes:
      - zlm-config:/opt/media/conf

# 如果不使用 host 模式，可以使用下面的配置
networks:
  gowvp-network:
    driver: bridge

volumes:
  zlm-config:
