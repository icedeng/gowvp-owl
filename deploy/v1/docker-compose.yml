services:
  gowvp:
    image: owl-v1-service:${OWL_IMAGE_TAG:-local}
    pull_policy: never
    platform: linux/${TARGETARCH:-amd64}
    build:
      context: ../..
      dockerfile: deploy/v1/Dockerfile.service
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    restart: unless-stopped
    init: true
    environment:
      OWL_ADMIN_USERNAME: ${OWL_ADMIN_USERNAME:-admin}
      OWL_ADMIN_PASSWORD: ${OWL_ADMIN_PASSWORD:-}
      OWL_JWT_SECRET: ${OWL_JWT_SECRET:-}
      OWL_RTMP_SECRET: ${OWL_RTMP_SECRET:-}
      OWL_WEBHOOK_SECRET: ${OWL_WEBHOOK_SECRET:-}
      OWL_SIP_PASSWORD: ${OWL_SIP_PASSWORD:-}
      OWL_MEDIA_SECRET: ${OWL_MEDIA_SECRET:?set OWL_MEDIA_SECRET in deploy/v1/.env}
      OWL_MEDIA_IP: zlm
      OWL_MEDIA_HTTP_PORT: "80"
      OWL_MEDIA_WEBHOOK_IP: gowvp
      OWL_MEDIA_SDP_IP: ${OWL_MEDIA_SDP_IP:?set OWL_MEDIA_SDP_IP to the LAN address in deploy/v1/.env}
    depends_on:
      zlm:
        condition: service_healthy
    ports:
      - "15060:15060"
      - "15060:15060/udp"
      - "15061:15061"
      - "3702:3702/udp"
      - "30200-30300:30200-30300"
    volumes:
      - ./data/configs:/app/configs
      - ./data/logs:/app/logs
      - ./data/recordings:/app/configs/recordings
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:15123/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - owl-v1

  frontend:
    image: owl-v1-frontend:${OWL_IMAGE_TAG:-local}
    pull_policy: never
    platform: linux/${TARGETARCH:-amd64}
    build:
      context: ../..
      dockerfile: deploy/v1/Dockerfile.frontend
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    restart: unless-stopped
    depends_on:
      gowvp:
        condition: service_healthy
    ports:
      - "${OWL_HTTP_PORT:-15123}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - owl-v1

  zlm:
    image: owl-v1-zlm:${OWL_IMAGE_TAG:-local}
    pull_policy: never
    platform: linux/${TARGETARCH:-amd64}
    build:
      context: ../..
      dockerfile: Dockerfile_zlm
      target: zlm-runtime
      args:
        ZLM_COMMIT: 2fa539807370c4bcfca9801bde1dd2fdd95ba113
    restart: unless-stopped
    init: true
    environment:
      OWL_MEDIA_SECRET: ${OWL_MEDIA_SECRET:?set OWL_MEDIA_SECRET in deploy/v1/.env}
      ZLM_API_DEBUG: "0"
    ports:
      - "1935:1935"
      - "554:554"
      - "${OWL_ZLM_HTTP_PORT:-8080}:80"
      - "8443:443"
      - "10000:10000"
      - "10000:10000/udp"
      - "20000-20100:20000-20100"
      - "20000-20100:20000-20100/udp"
      - "8000:8000/udp"
      - "9000:9000/udp"
    volumes:
      - ./data/zlm-config:/opt/media/conf
      - ./data/recordings:/opt/media/bin/configs/recordings
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1/index/api/getApiList?secret=$${OWL_MEDIA_SECRET}' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    networks:
      - owl-v1

networks:
  owl-v1:
    driver: bridge
